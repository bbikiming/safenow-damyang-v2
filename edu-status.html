<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이수현황 — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-status"
      data-page-title="이수현황"
      data-page-subtitle="부서별·대상자별 이수 현황을 보고 미이수자를 독촉합니다.">
    <main>
        <div class="check-notice">
            부서별 완료율과 대상자별 <b>주기(기간·D-day) · 필요 · 인정 · 미달 · 완료</b> 상태를 확인합니다. 주기는 현업근로자 상반기(1~6월)·하반기(7~12월), 관리감독자 1~12월입니다.
            정기교육 대상은 지금 관리감독자가 아닌 전원(사무직 포함)이라 법정 대상(현업업무 종사자)보다 넓습니다 — 담양군 지정명단을 받으면 좁힙니다. 관리감독자는 지정일이 등록돼야 판정합니다.
            미이수자를 개별 또는 일괄 선택해 부서 담당자에게 <b>독촉 알림</b>을 발송할 수 있습니다.
        </div>
        <div id="es-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/adm-perm.js"></script><!-- DYADM.deptContacts: 독촉 받는 사람(등급 → 부서장 대체) — 기획확인 4차 C-32 -->
    <script src="./js/edu-data.js"></script>
    <script src="./js/doc-flow.js"></script><!-- 공문 공용 골격 (DYDOC) -->
    <script src="./js/edu-doc.js"></script><!-- 교육 공문 (EDUDOC) -->
    <script src="./js/edu-filter.js"></script>
    <script src="./js/edu-status.js"></script>
    <script src="./js/tour-core.js"></script><!-- 단계별 안내 공용 엔진 (DYTOUR) -->
    <script src="./js/edu-tour.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.EDUS.init('es-root');
            window.EDUTOUR.boot();
        });
    </script>
</body>
</html>
