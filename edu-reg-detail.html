<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정기교육 상세 — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-reg"
      data-page-title="정기교육 상세"
      data-page-subtitle="참석자 등록부 · 서명부 · 출장 결과 보고서 · 교육 종료를 처리합니다."
      data-back-href="edu-reg.html"
      data-back-label="정기교육 목록">
    <main>
        <div id="erd-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/adm-perm.js"></script><!-- DYADM.deptContacts: 독촉 받는 사람(등급 → 부서장 대체) -->
    <script src="./js/edu-data.js"></script>
    <script src="./js/edu-filter.js"></script>
    <!-- 등록부 실제 참석시간 블록(모두에게 같은 시간 + 사람별)을 목록·상세·일괄 등록이 같이 쓴다 -->
    <script src="./js/edu-form.js"></script>
    <script src="./js/edu-reg-detail.js"></script>
    <script src="./js/tour-core.js"></script><!-- 단계별 안내 공용 엔진 (DYTOUR) -->
    <script src="./js/edu-tour.js"></script>
    <script>
        /* 관리감독자 교육이면 메뉴 위치·백 링크를 관리감독자 정기교육으로 — layout 이 그리기 전에(동기) 바꾼다(2026-11-17 검수) */
        (function () {
            try {
                var id = new URLSearchParams(location.search).get('id');
                var c = id && window.DYEDU && window.DYEDU.courseOf(id);
                if (c && /^SUP_/.test(c.kind || '')) {
                    document.body.setAttribute('data-dy-page', 'edu-sup');
                    document.body.setAttribute('data-back-href', 'edu-sup.html');
                    document.body.setAttribute('data-back-label', '관리감독자 정기교육 목록');
                }
            } catch (e) {}
        })();
        document.addEventListener('DOMContentLoaded', function () {
            window.EDURD.init('erd-root');
            window.EDUTOUR.boot();
        });
    </script>
</body>
</html>
