<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 관리 - 담양군 중대재해예방통합관리시스템 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="admin-menus" data-page-title="메뉴 관리" data-page-subtitle="시스템 관리 > 메뉴 관리 — 메뉴별 접근 권한 설정 (ADM01-S)">
    <main>
        <div class="admp-topbar">
            <span class="admp-topbar-hint">메뉴별 접근 권한을 설정합니다. 미설정 메뉴는 기본 차단(시스템 관리자 제외)이며, 실제 메뉴 노출 반영은 권한 연계 후 적용됩니다.</span>
            <span class="spacer" style="flex:1;"></span>
            <button class="btn btn-outline btn-sm" onclick="DYADMENU.resetDemo()">데모 데이터 초기화</button>
        </div>

        <div class="card" style="margin-bottom:16px;">
            <div class="card-header" style="gap:10px; flex-wrap:wrap;">
                <span class="card-title">메뉴 이용 현황 <span class="chip-mini wt" style="margin-left:6px;">예시 자료</span></span>
                <span class="spacer" style="flex:1;"></span>
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;">조회 기간
                    <select class="select" id="admm-usage-period" onchange="DYADMENU.setUsagePeriod(this.value)">
                        <option value="30">최근 30일</option>
                        <option value="90" selected>최근 90일</option>
                        <option value="180">최근 180일</option>
                    </select>
                </label>
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
                    <input type="checkbox" id="admm-usage-unused" onchange="DYADMENU.toggleUsageUnused(this.checked)"> 기간 내 미사용만
                </label>
            </div>
            <div class="card-body">
                <div id="admm-usage-summary" class="admm-auto" style="margin-bottom:12px;"></div>
                <div style="overflow:auto;max-height:330px;">
                    <table class="table-figma">
                        <thead><tr><th>대메뉴</th><th>메뉴</th><th style="text-align:right;">이용 건수</th><th>최종 이용일</th><th>판정</th><th></th></tr></thead>
                        <tbody id="admm-usage-rows"></tbody>
                    </table>
                </div>
                <p style="font-size:12px;color:var(--text-gray);margin-top:10px;">본개발은 접속·화면 이용 기록을 기준으로 집계하며, 건수 0은 선택 기간 내 미사용을 뜻합니다. 사용자·개인별 행태 분석은 하지 않습니다.</p>
            </div>
        </div>

        <div class="admp-2col" id="adm-menus-app">
            <div class="admp-listcard card">
                <div class="card-header"><span class="card-title">메뉴 트리</span></div>
                <div class="admm-search">
                    <input id="admm-q" type="text" placeholder="메뉴명 검색" oninput="DYADMENU.search(this.value)">
                </div>
                <div id="admm-tree" class="admm-tree-body"></div>
            </div>
            <div id="admm-panel" class="admp-panel"></div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/adm-perm.js"></script>
    <script src="./js/admin-menus.js"></script>
</body>
</html>
