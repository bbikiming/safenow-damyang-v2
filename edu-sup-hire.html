<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리감독자 채용시교육 — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-sup-hire"
      data-page-title="관리감독자 채용시교육"
      data-page-subtitle="관리감독자 채용 시 교육 8시간 — 별표4 제1호의2 나목 (EDU-SUP-HIRE)">
    <main>
        <div class="check-notice">
            <b>관리감독자 채용 시 교육은 8시간</b>입니다 — 시행규칙 별표4 <b>제1호의2 나목</b>이
            교육과정별 시간만 정하고 교육대상 열을 두지 않아, 근로자와 달리 고용형태로 갈리지 않습니다.
            <b>기준일은 채용일과 지정일 중 늦은 쪽</b>입니다. 담양군은 기존 공무원 중에서 관리감독자를
            지정하므로 채용일을 기준으로 삼으면 <b>그 시점에 관리감독자가 아니었던 사람</b>을 미이수로
            찍게 되기 때문입니다.
            <b>지정일이 등록되지 않은 사람은 '판정 불가'</b>로 두고 미이수로 세지 않습니다 —
            없는 기준으로 의무를 지우지 않습니다. 지정일은 <b>근로자 명단 관리</b>에서 등록합니다.
        </div>
        <div id="eh-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/edu-data.js"></script>
    <script src="./js/doc-flow.js"></script><!-- 공문 공용 골격 (DYDOC) -->
    <script src="./js/edu-doc.js"></script><!-- 교육 공문 (EDUDOC) -->
    <script src="./js/edu-filter.js"></script>
    <script src="./js/edu-form.js"></script>
    <script src="./js/edu-hire.js"></script>
    <script src="./js/tour-core.js"></script><!-- 시연 투어 공용 엔진 (DYTOUR) -->
    <script src="./js/edu-tour.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.EDUH.init('eh-root', { supMode: true });
            window.EDUTOUR.boot();
        });
    </script>
</body>
</html>
