<!DOCTYPE html>
<html lang="ko">

<body data-dy-page="docs-exec" data-page-title="이행 목록" data-page-subtitle="업무문서 &gt; 이행 목록 — 법정 이행항목별 하위 업무단계의 증빙 문서가 갖춰졌는지 봅니다">

    <script src="./js/law-map.js"></script>

        document.addEventListener('DOMContentLoaded', function () {
            DOCEXEC.init(document.getElementById('docs-exec'));
        });
