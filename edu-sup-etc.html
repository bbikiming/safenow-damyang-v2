<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리감독자 기타 교육 — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-sup-etc"
      data-page-title="관리감독자 기타 교육"
      data-page-subtitle="관리감독자의 작업내용 변경 시 교육 · 특별교육을 등록합니다.">
    <main>
        <div class="check-notice">
            관리감독자 기타 교육은 <b>작업내용 변경 시 교육 2시간 · 특별교육 16시간</b>(단기간·간헐적 작업 2시간)
            두 가지입니다. 각 과가 직접 등록합니다.
            관리감독자 채용 시 교육(8시간)은 <b>관리감독자 › 채용시교육</b>에서 관리합니다.
        </div>
        <div id="ee-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/edu-data.js"></script>
    <script src="./js/doc-flow.js"></script><!-- 공문 공용 골격 (DYDOC) -->
    <script src="./js/edu-doc.js"></script><!-- 교육 공문 (EDUDOC) -->
    <script src="./js/edu-filter.js"></script>
    <script src="./js/edu-form.js"></script>
    <script src="./js/edu-etc.js"></script>
    <script src="./js/tour-core.js"></script><!-- 단계별 안내 공용 엔진 (DYTOUR) -->
    <script src="./js/edu-tour.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.EDUE.init('ee-root', { supMode: true });
            window.EDUTOUR.boot();
        });
    </script>
</body>
</html>
