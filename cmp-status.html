<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이행 관리 - 담양군 중대재해예방통합관리시스템 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="cmp-status" data-page-title="이행 관리" data-page-subtitle="업무 관리 &gt; 이행 관리 — 법으로 해야 하는 일을 군·부서·관리대상 세 계층으로 나눠 봅니다">
    <main>
        <div id="cmp-status"></div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/tour-core.js"></script><!-- DYTOUR 공용 투어 엔진 -->
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/data.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/doc-flow.js"></script><!-- DYDOC: 공문 골격 + 결재선 공용 조각 -->
    <script src="./js/edu-filter.js"></script><!-- 공용 필터 바 (EDUFILTER) -->
    <script src="./js/edoc-templates.js"></script>
    <script src="./js/edoc.js"></script>
    <!-- 업무문서 데이터 — 생성물(tools/build-docs-seed.py). 손으로 고치지 말 것 -->
    <script src="./js/doc-taxonomy-data.js"></script><!-- DYDOCT: 이행항목·업무단계 분류 축 (건수는 생성물에서 파생 — 주석에 박지 않는다) -->
    <script src="./js/doc-history-data.js"></script><!-- DYDOCH: 2025 문서 원장 3,830 -->
    <script src="./js/doc-seed-2026.js"></script><!-- DYDOC2026: 2026 예시 자료 (생성물) -->
    <script src="./js/sets-data-v2.js"></script><!-- DY_DOCS_V2 426 -->
    <script src="./js/facil-data.js"></script><!-- DY_FACIL_SEED: FMS 시설물 80건 (L3 관리대상) -->
    <script src="./js/facil.js"></script><!-- DYFACIL: 시설 파생(보완입력 저장분 포함) -->
    <script src="./js/doc-progress.js"></script><!-- DYDOCS: 상태·진행률·문서 축 단일 출처 -->
    <script src="./js/doc-pick.js"></script><!-- DYPICK: 이행항목·업무단계 2단 선택기 -->
    <script src="./js/doc-upload.js"></script><!-- DOCUP: 업무 업로드 마법사 -->
    <script src="./js/cmp-dept-docs.js"></script><!-- DYCMPDEPT: 부서별 문서 보유량(5개년 원장 집계) -->
    <script src="./js/cmp-core.js"></script><!-- DYCMP: 계층·주기·이행상태 파생 -->
    <script src="./js/cmp-status.js"></script>
    <script src="./js/doc-tour.js"></script><!-- DOCTOUR: 업무문서 단계별 안내 (2026-09-01 은퇴 화면에서 이관) -->
    <script>
        /* layout.js 가 DOMContentLoaded 에서 .dy-page-title 을 주입하므로 그 뒤에 붙는다
           — 먼저 돌면 제목 줄 액션(기준연도·서류 올리기)이 붙을 자리가 없다 */
        document.addEventListener('DOMContentLoaded', function () {
            CMPST.init(document.getElementById('cmp-status'));
            DOCTOUR.boot();
        });
    </script>
</body>
</html>
