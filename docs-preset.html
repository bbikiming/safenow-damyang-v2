<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 목록 - 담양군 중대재해예방통합관리시스템 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<!-- ※ 파일명 주의 — 'preset' 은 옛 이름이다. 전년도 프리셋 기능은 이 화면이 아니라
     이행 목록(docs-exec.html)에 있고, 이 화면은 평면 문서 검색이다. URL 은 기존
     딥링크(stats·docs-archive·my-work·menu) 호환 때문에 그대로 둔다. -->
<body data-dy-page="docs-preset" data-page-title="업무 목록" data-page-subtitle="업무문서 &gt; 업무 목록 — 우리 부서가 주고받은 문서를 조건으로 좁혀 찾습니다">
    <main>
        <div id="docs-list"></div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/tour-core.js"></script><!-- DYTOUR 공용 투어 엔진 -->
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/data.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/doc-flow.js"></script><!-- DYDOC: 공문 골격 + 결재선 공용 조각 -->
    <script src="./js/edu-filter.js"></script><!-- 공용 필터 바 (EDUFILTER) -->
    <script src="./js/edoc-templates.js"></script>
    <script src="./js/edoc.js"></script>
    <!-- 업무문서 데이터 — 생성물(tools/build-docs-seed.py). 손으로 고치지 말 것 -->
    <script src="./js/doc-taxonomy-data.js"></script><!-- DYDOCT: 이행항목·업무단계 분류 축 (건수는 생성물에서 파생 — 주석에 박지 않는다) -->
    <script src="./js/doc-history-data.js"></script><!-- DYDOCH: 2025 문서 원장 3,830 -->
    <script src="./js/doc-seed-2026.js"></script><!-- DYDOC2026: 2026 예시 자료 (생성물) -->
    <script src="./js/sets-data-v2.js"></script><!-- DY_DOCS_V2 426 — 전자문서·전용화면 진입점 보존 -->
    <script src="./js/doc-progress.js"></script><!-- DYDOCS: 상태·진행률·문서 축 단일 출처 -->
    <script src="./js/doc-pick.js"></script><!-- DYPICK: 이행항목·업무단계 2단 선택기 -->
    <script src="./js/doc-upload.js"></script><!-- DOCUP: 업무 업로드 마법사 · 전년도 프리셋 -->
    <script src="./js/doc-list.js"></script>
    <script src="./js/doc-tour.js"></script><!-- DOCTOUR: 업무문서 단계별 안내 -->
    <script>
        /* layout.js 가 DOMContentLoaded 에서 .dy-page-title 을 주입한 뒤에 붙는다 */
        document.addEventListener('DOMContentLoaded', function () {
            DOCLIST.init(document.getElementById('docs-list'));
            DOCTOUR.boot();
        });
    </script>
</body>
</html>
