<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원료·제조물 대장 - 담양군 중대재해예방통합관리시스템 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="base-targets" data-page-title="원료·제조물 대장" data-page-subtitle="관리대상 &gt; 원료·제조물 대장 — 중대시민재해 원료·제조물 축의 품목 대장 · 등록·정정·사용중지 (SFR-002)">
    <main>

        <section>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">품목 목록 <span id="tgt-mat-cnt" class="cmp-dim">(불러오는 중)</span></span>
                    <span id="mat-act"></span>
                </div>
                <div class="card-body" style="overflow-x:auto;">
                    <div id="mat-notice"></div>
                    <table class="table-figma">
                        <thead><tr><th>품목</th><th>구분</th><th>사용처</th><th>안전자료</th><th>상태</th><th>관리</th></tr></thead>
                        <tbody id="tgt-mat-rows"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/data.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script><!-- 부서 선택 공용 인라인 조직도 -->
    <script src="./js/material-data.js"></script><!-- 원료·제조물 대장 단일 출처 -->
    <script>
        /* 원료·제조물 개별 등록 (SCR-BASE-003 §5).
           일괄등록 서식을 두지 않기로 확정했으므로(SCR-BASE-004 §6 BLK-02) 이 경로가
           유일한 입력 수단이다 — 버튼이 안내만 내면 등록 흐름을 확정할 수 없다.
           부서 선택은 공용 인라인 조직도만 쓴다(새 select 금지). */
        window.MATREG = (function () {
            const esc = s => DYV2.esc(String(s == null ? '' : s));
            let F = null;
            /* 조작 권한 — 2026-09-03 신설. 이 화면이 메뉴에 서면서 군수·과장에게도
               [+ 등록]·[수정]·[사용 중지]가 뜨는 상태가 됐다(§12 「확인 등록 11개」 사고).
               판정은 DYROLE.canAct 단일 출처이고, 부서를 **이름**으로 저장하는 도메인이라
               DYV2.deptIdOf(name) 로 id 를 얻어 물어본다(§3 dept/deptId 이원화).
               버튼만 숨기면 전역 호출로 뚫리므로 진입·저장 양쪽에 건다. */
            function canEdit(rec) {
                if (!window.DYROLE || !DYROLE.canAct) return true;
                const depts = (rec && rec.depts) || [];
                if (!depts.length) return DYROLE.canAct(null);
                return depts.some(nm => DYROLE.canAct(DYV2.deptIdOf ? DYV2.deptIdOf(nm) : null));
            }
            function deny() {
                DYV2.toast((window.DYROLE && DYROLE.readOnlyNote)
                    ? (DYROLE.readOnlyNote('품목 등록·정정') || '품목 등록·정정은 부서 담당자가 합니다.')
                    : '품목 등록·정정은 부서 담당자가 합니다.');
            }
            function body() {
                return '<div class="form-group"><label class="form-label" for="mat-nm">품목명 <span style="color:var(--status-danger-fg)">*</span></label>' +
                        '<input type="text" class="form-input" id="mat-nm" value="' + esc(F.name) + '" placeholder="예: 수처리 약품 (PAC)"></div>' +
                    '<div class="form-group"><label class="form-label">구분 <span style="color:var(--status-danger-fg)">*</span></label>' +
                        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                        ['원료', '제조물'].map(k =>
                            '<button type="button" class="btn btn-sm ' + (F.kind === k ? 'btn-primary' : 'btn-outline') + '"' +
                            ' onclick="MATREG.setKind(\'' + k + '\')">' + k + '</button>').join('') +
                        '</div></div>' +
                    '<div class="form-group"><label class="form-label">사용처 <span style="color:var(--status-danger-fg)">*</span>' +
                        ' <span class="file-hint">여러 곳을 고를 수 있습니다</span></label>' +
                        '<div class="orgpick-field" id="mat-dept">' +
                            '<input type="text" class="form-input" id="mat-dept-in" readonly' +
                                ' placeholder="조직도에서 사용 부서를 고르세요" value="' + esc(F.depts.join(' · ')) + '">' +
                        '</div>' +
                        (F.depts.length ? '<p class="file-hint" style="margin-top:4px;">' +
                            F.depts.map((d, i) => '<button type="button" class="btn btn-sm btn-outline" onclick="MATREG.delDept(' + i + ')">' + esc(d) + ' ×</button>').join(' ') +
                        '</p>' : '') +
                    '</div>' +
                    '<div class="form-group"><label class="form-label" for="mat-doc-state">안전자료 상태 <span style="color:var(--status-danger-fg)">*</span></label>' +
                        '<select class="form-select" id="mat-doc-state" onchange="MATREG.setDocState(this.value)">' +
                            ['보유', '미보유', '해당 없음'].map(k => '<option value="' + k + '"' + (F.safetyDocState === k ? ' selected' : '') + '>' + k + '</option>').join('') +
                        '</select></div>' +
                    (F.safetyDocState === '보유' ? '<div class="form-group"><label class="form-label">물질안전보건자료 또는 제품 안전자료 <span style="color:var(--status-danger-fg)">*</span></label>' +
                        DYV2.uploadDrop('자료 파일을 끌어다 놓거나 클릭하여 선택', 'MATREG.pickFile()', { hint: true }) +
                        (F.msdsName ? '<p class="file-hint" style="margin-top:4px;">선택됨 — ' + esc(F.msdsName) + '</p>'
                                : '<p class="file-hint" style="margin-top:4px;">보유로 표시하려면 파일을 선택해야 합니다.</p>') +
                    '</div>' : '') +
                    (F.safetyDocState === '해당 없음' ? '<div class="form-group"><label class="form-label" for="mat-doc-reason">해당 없음 사유 <span style="color:var(--status-danger-fg)">*</span></label>' +
                        '<textarea class="form-input" id="mat-doc-reason" rows="2">' + esc(F.msdsReason) + '</textarea></div>' : '') +
                    '<div class="form-group"><label class="form-label" for="mat-note">비고</label><textarea class="form-input" id="mat-note" rows="2">' + esc(F.note) + '</textarea></div>';
            }
            function draw() { DYV2.openModal(F.id ? '원료·제조물 수정' : '원료·제조물 등록', body(),
                '<button type="button" class="btn btn-outline" onclick="DYV2.closeModal()">취소</button>' +
                '<button type="button" class="btn btn-primary" onclick="MATREG.save()">' + (F.id ? '저장' : '등록') + '</button>'); wire(); }
            function wire() { if (window.ORGPICK) ORGPICK.toggle('mat-dept', 'dept', 'MATREG.addDept'); }
            function cap() {
                const name = document.getElementById('mat-nm'); if (name) F.name = name.value;
                const reason = document.getElementById('mat-doc-reason'); if (reason) F.msdsReason = reason.value;
                const note = document.getElementById('mat-note'); if (note) F.note = note.value;
            }
            function open(id) {
                const src = id && DYMATERIAL.itemOf(id);
                if (!canEdit(src)) { deny(); return; }
                F = src ? JSON.parse(JSON.stringify(src)) : { id: '', name: '', kind: '원료', depts: [], safetyDocState: '미보유', msdsName: '', msdsReason: '', note: '' };
                draw();
            }
            function setKind(k) { cap(); F.kind = k; draw(); }
            function setDocState(k) { cap(); F.safetyDocState = k; if (k !== '보유') F.msdsName = ''; if (k !== '해당 없음') F.msdsReason = ''; draw(); }
            function addDept(nm) { cap(); if (nm && F.depts.indexOf(nm) < 0) F.depts.push(nm); draw(); }
            function delDept(i) { cap(); F.depts.splice(i, 1); draw(); }
            function pickFile() { cap(); F.msdsName = '물질안전보건자료.pdf'; draw(); DYV2.toast('물질안전보건자료.pdf 를 선택했습니다 — 파일 저장은 문서관리 연계 후 적용됩니다'); }
            function save() {
                if (!canEdit(F)) { deny(); return; }
                cap();
                if (!F.name.trim()) { DYV2.toast('품목명을 입력하세요.'); return; }
                if (!F.depts.length) { DYV2.toast('사용하는 부서를 고르세요.'); return; }
                if (F.safetyDocState === '보유' && !F.msdsName) { DYV2.toast('보유한 안전자료 파일을 선택하세요.'); return; }
                if (F.safetyDocState === '해당 없음' && !F.msdsReason.trim()) { DYV2.toast('해당 없음 사유를 입력하세요.'); return; }
                if (DYMATERIAL.duplicateOf(F.name, F.id)) { DYV2.toast('같은 이름의 품목이 이미 있습니다. 기존 품목을 수정하세요.'); return; }
                if (F.id) DYMATERIAL.update(F.id, F); else DYMATERIAL.add(F);
                DYV2.closeModal();
                render();
                DYV2.toast((F.id ? '원료·제조물을 수정했습니다 · ' : '원료·제조물을 등록했습니다 · ') + F.name);
            }
            let stopId = '';
            function askStop(id) {
                if (!canEdit(DYMATERIAL.itemOf(id))) { deny(); return; }
                stopId = id;
                const item = DYMATERIAL.itemOf(id);
                DYV2.openModal('원료·제조물 사용 중지',
                    '<p class="file-hint" style="margin-bottom:12px;"><b>' + esc(item ? item.name : '') + '</b>을 신규 업무 선택지에서 제외합니다. 과거 기록과 품목 식별값은 보존됩니다.</p>' +
                    '<div class="form-group"><label class="form-label" for="mat-stop-reason">사용 중지 사유 <span style="color:var(--status-danger-fg)">*</span></label>' +
                    '<textarea class="form-input" id="mat-stop-reason" rows="3" maxlength="200"></textarea></div>',
                    '<button type="button" class="btn btn-outline" onclick="DYV2.closeModal()">취소</button>' +
                    '<button type="button" class="btn btn-primary" onclick="MATREG.confirmStop()">사용 중지</button>');
            }
            function confirmStop() {
                const el = document.getElementById('mat-stop-reason');
                const reason = el ? el.value.trim() : '';
                if (!reason) { DYV2.toast('사용 중지 사유를 입력하세요.'); return; }
                DYMATERIAL.setActive(stopId, false, reason);
                stopId = '';
                DYV2.closeModal();
                render();
                DYV2.toast('품목을 사용 중지했습니다.');
            }
            function reactivate(id) {
                if (!canEdit(DYMATERIAL.itemOf(id))) { deny(); return; }
                DYMATERIAL.setActive(id, true, '');
                render();
                DYV2.toast('품목을 다시 사용합니다.');
            }
            function render() {
                const tb = document.getElementById('tgt-mat-rows');
                if (!tb) return;
                const all = DYMATERIAL.list(true);
                const active = all.filter(r => r.active !== false);
                tb.innerHTML = all.map(r => {
                    const docTone = r.safetyDocState === '보유' ? 'st-done' : r.safetyDocState === '해당 없음' ? 'wt' : 'st-doing';
                    const docNote = r.safetyDocState === '보유' ? r.msdsName : r.safetyDocState === '해당 없음' ? r.msdsReason : '자료 확보 필요';
                    return '<tr' + (r.active === false ? ' style="opacity:.62;"' : '') + '><td><b>' + esc(r.name) + '</b><div class="file-hint">' + esc(r.note || '') + '</div></td>' +
                        '<td>' + esc(r.kind) + '</td><td>' + esc(r.depts.join(' · ')) + '</td>' +
                        '<td><span class="chip-mini ' + docTone + '">' + esc(r.safetyDocState) + '</span><div class="file-hint">' + esc(docNote) + '</div></td>' +
                        '<td>' + (r.active === false ? '<span class="chip-mini wt">사용 중지</span><div class="file-hint">' + esc(r.inactiveReason || '') + '</div>' : '<span class="chip-mini st-done">사용 중</span>') + '</td>' +
                        '<td class="col-action">' + (canEdit(r)
                            ? '<button type="button" class="btn btn-sm btn-outline" onclick="MATREG.open(\'' + r.id + '\')">수정</button> ' +
                              (r.active === false
                                  ? '<button type="button" class="btn btn-sm btn-outline" onclick="MATREG.reactivate(\'' + r.id + '\')">다시 사용</button>'
                                  : '<button type="button" class="btn btn-sm btn-outline" onclick="MATREG.askStop(\'' + r.id + '\')">사용 중지</button>')
                            : '<span class="cmp-dim">조회 전용</span>') + '</td></tr>';
                }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-gray);">등록된 품목이 없습니다. 0건은 해당 없음이 아니며, 확인 결과를 등록하세요.</td></tr>';
                const cnt = document.getElementById('tgt-mat-cnt');
                if (cnt) cnt.textContent = '(' + active.length + '건)';
                /* 등록 버튼은 페이지 제목 줄에 올린다(§14-12 — 제목을 두 번 쓰지 않는다).
                   권한이 없으면 버튼을 내지 않고 누가 하는지를 대신 밝힌다. */
                const act = document.getElementById('mat-act');
                if (act) {
                    act.innerHTML = canEdit(null)
                        ? '<button type="button" class="btn btn-primary btn-sm" onclick="MATREG.open()">＋ 품목 등록</button>'
                        : '<span class="cmp-dim">조회 전용 — 품목 등록은 부서 담당자가 합니다.</span>';
                }
                /* 접어도 남는 한 줄은 설명이 아니라 «지금 상태»여야 한다(§14-12).
                   건수는 세어서 쓴다 — 문장에 박으면 시드가 바뀔 때 여기만 옛 수치로 남는다. */
                const nt = document.getElementById('mat-notice');
                if (nt && DYV2.notice) {
                    nt.innerHTML = DYV2.notice('mat-scope',
                        '담양군 적용 대상 품목 목록 <b>미수신</b> — 등록 ' + all.length + '건은 <b>예시 자료</b>입니다',
                        '<p>실제 생산·판매·유통·관리 품목 자료가 오면 이 대장에서 확인·정정합니다. ' +
                        '<b>현재 건수를 법정 적용 대상 수로 사용하지 않으며, 0건도 해당 없음으로 단정하지 않습니다.</b></p>' +
                        '<p>중대시민재해의 원료·제조물 축(중대재해처벌법 제9조제1항)에 해당하는 품목만 담습니다 — ' +
                        '사업장은 시스템 관리 &gt; 사업장 관리가, 공중이용시설은 관리대상 &gt; 시설물 대장이 정본입니다.</p>');
                }
            }
            document.addEventListener('DOMContentLoaded', render);
            return { open, setKind, setDocState, addDept, delDept, pickFile, save, askStop, confirmStop, reactivate, render };
        })();
    </script>
</body>
</html>
