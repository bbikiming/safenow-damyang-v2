<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정기교육 (현업근로자) — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-reg"
      data-page-title="정기교육 (현업근로자)"
      data-page-subtitle="집합교육은 참석자 등록부로, 자체교육은 부서가 바로 등록합니다.">
    <main>
        <div class="check-notice">
            <b>정기교육</b>은 반기마다 채웁니다 — 상반기(1~6월)·하반기(7~12월), 사무직·판매 6시간 · 그 밖의 근로자 12시간. 반기 중간에 채용된 사람도 그 반기 시간을 채웁니다.
            <b>집합교육</b>은 재난안전과가 등록하고 부서가 교육이 끝난 뒤 참석자 등록부(서명부)를 올립니다.
            <b>자체교육</b>은 부서가 등록·즉시 완료 처리합니다.
        </div>
        <div id="er-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/edu-data.js"></script>
    <script src="./js/doc-flow.js"></script><!-- 공문 공용 골격 (DYDOC) -->
    <script src="./js/edu-doc.js"></script><!-- 교육 공문 (EDUDOC) -->
    <script src="./js/edu-filter.js"></script>
    <script src="./js/edu-form.js"></script>
    <script src="./js/edu-reg.js"></script>
    <script src="./js/tour-core.js"></script><!-- 단계별 안내 공용 엔진 (DYTOUR) -->
    <script src="./js/edu-tour.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.EDUR.init('er-root');
            window.EDUTOUR.boot();
        });
    </script>
</body>
</html>
