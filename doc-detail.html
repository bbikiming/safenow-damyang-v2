<html lang="ko">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="./css/style.css">

<body data-dy-page="docs-preset">
    <main>
        <!-- 2026-09-03 — 이 화면은 메뉴에서 뺐다. 다른 은퇴 화면 9개는 페이지 부제로
             그 사실을 밝히는데, 이 화면만 자체 브레드크럼을 써서 **링크로 도착한 사람이
             자기가 이전 버전 화면에 있다는 것을 알 방법이 없었다**(§16 «부제에 이전
             버전임과 대체 화면을 밝힌다»). 크롬이 없으므로 본문 맨 위에 직접 적는다. -->
        <p class="dd-retired">
            <b>이전 버전 화면입니다.</b> 업무 관리는 <b>이행 관리 · 문서 목록 · 내 할일</b> 셋으로 끝냅니다 —
            지금 문서를 여는 자리는 <a href="cmp-docs.html">업무 관리 &gt; 문서 목록</a>의 문서 상세입니다.
            이 화면은 메뉴에 없으며 주소·즐겨찾기로만 열립니다.
        </p>

        <!-- 브레드크럼 -->
        <nav class="dd-breadcrumb" id="dd-breadcrumb" aria-label="위치"></nav>

        <div class="dd-grid">
            <!-- 좌측: 문서 상세 (원장·등록분 = DOCDET / 현행 업무문서 = doc-detail.js) -->
            <section class="dd-main" id="dd-main"></section>

            <!-- 우측: 관련 문서 -->
            <aside class="dd-side" id="dd-side"></aside>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->

    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>

    <script src="./js/edoc.js"></script>
    <script src="./js/sets-data.js"></script>
    <script src="./js/sets-data-v2.js"></script>
    <script src="./js/doc-register.js"></script>

    <script src="./js/doc-detail-ledger.js"></script><!-- DOCDET — 새 축 문서. doc-detail.js 앞에 로드 -->
