<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결재 이력 — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-approval"
      data-page-title="결재 이력"
      data-page-subtitle="안전보건교육에서 온나라로 보낸 공문을 봅니다.">
    <main>
        <div class="check-notice">
            안전보건교육에서 온나라로 보낸 공문을 조회합니다. 공문은 종료 처리된 교육의 <b>[공문 기안]</b>에서 온나라 기안함으로 보냅니다.
            행의 <b>[문서]</b>로 보낸 문서를 다시 보고, 검토·결재 지정과 진행은 <b>온나라</b>에서 합니다.
        </div>
        <div id="eal-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/edu-data.js"></script>
    <script src="./js/doc-flow.js"></script><!-- 공문 공용 골격 (DYDOC) -->
    <script src="./js/edu-doc.js"></script><!-- 교육 공문 (EDUDOC) -->
    <script src="./js/edu-filter.js"></script>
    <script src="./js/edu-apv-log.js"></script>
    <script src="./js/tour-core.js"></script><!-- 단계별 안내 공용 엔진 (DYTOUR) -->
    <script src="./js/edu-tour.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.EDUAPVLOG.init('eal-root');
            window.EDUTOUR.boot();
        });
    </script>
</body>
</html>
