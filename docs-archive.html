<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기준문서함 - 담양군 중대재해예방통합관리시스템 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="docs-archive" data-page-title="기준문서함" data-page-subtitle="업무문서 > 기준문서함 — V2 분류가 확정된 첨부·보관 문서 조회 · 버전 이력 · 다중 첨부">
    <main>
        <div id="archive-stats" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:16px;"></div>

        <div class="card">
            <div class="card-header">
                <span class="card-title" id="archive-count">기준문서함</span>
                <button class="btn btn-primary btn-sm" onclick="DYV2.toast('기준문서 업로드 — 다중 첨부 가능 (프로토타입)')">+ 문서 업로드 (다중)</button>
            </div>
            <div class="card-body">
                <div class="v2-toolbar">
                    <select class="select" id="f-menu">
                        <option value="">대메뉴 전체</option>
                    </select>
                    <select class="select" id="f-law">
                        <option value="">근거 구분 전체</option>
                        <option>중처법</option>
                        <option>산안법</option>
                        <option>복합근거</option>
                        <option>기타근거</option>
                    </select>
                    <select class="select" id="f-flag">
                        <option value="">표시 전체</option>
                        <option value="reference">참고·보관</option>
                        <option value="inspection">안전점검 계열</option>
                    </select>
                    <div class="search-bar">
                        <input class="search-input" id="f-q" type="text" placeholder="문서명 검색">
                        <button class="search-submit" type="button">검색</button>
                    </div>
                    <span class="spacer"></span>
                    <span class="v2-todo">안전점검은 별도 대메뉴 없이 현장점검 흐름과 기준문서 분류로 관리합니다.</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="table-figma">
                        <thead><tr><th>문서명</th><th>대메뉴</th><th>법령</th><th>표시</th><th>버전</th><th>최종 수정</th><th>관리</th></tr></thead>
                        <tbody id="archive-tbody"></tbody>
                    </table>
                </div>
                <p style="font-size:12px; color:var(--text-gray); margin-top:10px;" id="archive-note"></p>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/data.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/edoc-templates.js"></script>
    <script src="./js/edoc.js"></script>
    <script src="./js/sets-data-v2.js"></script>
    <script>
        /* 기준문서함 = V2 정본의 첨부파일 문서.
         * 분류 상태가 아니라 문서 성격(참고·보관 / 안전점검 계열)을 표시한다. */
        (function () {
            const V = DYV2;
            const ALL = (window.DY_DOCS_V2 || []).filter(d => d.processType === '첨부파일');
            const PAGE = 20;
            let shownLimit = PAGE;

            const reference = ALL.filter(d => d.docRole === '참고자료');
            const inspection = ALL.filter(isInspection);
            document.getElementById('archive-stats').innerHTML =
                '<div class="statbox neutral"><div class="statbox-num">' + ALL.length + '</div><div class="statbox-label">보관 문서 전체</div></div>' +
                '<div class="statbox info"><div class="statbox-num">' + reference.length + '</div><div class="statbox-label">참고·보관</div></div>' +
                '<div class="statbox info"><div class="statbox-num">' + inspection.length + '</div><div class="statbox-label">안전점검 계열</div></div>' +
                '<div class="statbox success"><div class="statbox-num">' + ALL.filter(d => d.setId && d.pdca).length + '</div><div class="statbox-label">V2 분류 완료</div></div>';

            /* 대메뉴 필터 옵션 — 실데이터 기준 자동 생성 */
            const menus = [...new Set(ALL.map(d => d.daemenu))];
            const fMenu = document.getElementById('f-menu');
            menus.forEach(m => {
                const o = document.createElement('option');
                o.value = m; o.textContent = m + ' (' + ALL.filter(d => d.daemenu === m).length + ')';
                fMenu.appendChild(o);
            });

            function basisGroup(d) {
                const b = d.legalBasis || '';
                const c = b.indexOf('중처') >= 0;
                const o = b.indexOf('산안') >= 0;
                if (c && o) return '복합근거';
                if (c) return '중처법';
                if (o) return '산안법';
                return '기타근거';
            }
            function isInspection(d) {
                return /점검/.test([d.subType, d.theme, d.name].join(' '));
            }
            function flags(d) {
                let h = '';
                if (d.docRole === '참고자료') h += '<span class="chip-mini wt-attach">참고·보관</span> ';
                if (isInspection(d)) h += V.secondReviewBadge();
                return h || '-';
            }
            function render() {
                const m = fMenu.value;
                const law = document.getElementById('f-law').value;
                const flag = document.getElementById('f-flag').value;
                const q = document.getElementById('f-q').value.trim();
                const list = ALL.filter(d =>
                    (!m || d.daemenu === m) &&
                    (!law || basisGroup(d) === law) &&
                    (flag !== 'reference' || d.docRole === '참고자료') &&
                    (flag !== 'inspection' || isInspection(d)) &&
                    (!q || d.name.indexOf(q) >= 0)
                );
                const shown = list.slice(0, shownLimit);
                document.getElementById('archive-count').textContent = '기준문서함 (' + list.length + '건)';
                document.getElementById('archive-tbody').innerHTML = shown.map(d =>
                    '<tr>' +
                    '<td style="font-weight:600; max-width:420px;">' + V.esc(d.name) + '</td>' +
                    '<td><a href="docs-preset.html?ver=v2&menu=' + d.menuKey + '" class="chip-mini pdca" style="text-decoration:none;">' + V.esc(d.daemenu) + '</a></td>' +
                    '<td><span class="chip-mini wt" title="' + V.esc(d.legalBasis || '근거 없음') + '">' + basisGroup(d) + '</span></td>' +
                    '<td>' + flags(d) + '</td>' +
                    '<td>' + V.esc(d.version) + '</td>' +
                    '<td>' + V.esc(d.updated) + '</td>' +
                    '<td class="col-action"><a class="btn btn-sm btn-outline" href="doc-detail.html?id=' + d.id + '&v=2">미리보기</a></td>' +
                    '</tr>'
                ).join('') || '<tr><td colspan="7"><div class="v2-empty">조건에 맞는 문서가 없습니다.</div></td></tr>';
                document.getElementById('archive-note').innerHTML = list.length > shown.length
                    ? shown.length + ' / ' + list.length + '건 표시 — <a href="#" style="color:var(--main-dark); font-weight:700;" onclick="DYV2._more(); return false;">더 보기</a>'
                    : list.length + '건 전체 표시';
            }
            DYV2._more = function () { shownLimit += PAGE; render(); };
            ['f-menu', 'f-law', 'f-flag'].forEach(id =>
                document.getElementById(id).addEventListener('change', () => { shownLimit = PAGE; render(); }));
            document.getElementById('f-q').addEventListener('input', () => { shownLimit = PAGE; render(); });

            /* 딥링크 ?filter=reference|inspection */
            const deepFilter = new URLSearchParams(location.search).get('filter');
            if (deepFilter === 'reference' || deepFilter === 'inspection') {
                document.getElementById('f-flag').value = deepFilter;
            }
            render();
        })();
    </script>
</body>
</html>
