<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현업근로자 명단 — 담양군 중대재해예방통합관리시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/v2.css">
</head>
<body data-dy-page="edu-workers"
      data-page-title="현업근로자 명단"
      data-page-subtitle="현업근로자와 하는 업무(현업업무)를 관리합니다 — 안전보건교육 대상의 기준입니다.">
    <main>
        <div class="check-notice">
            안전보건교육 대상 근로자 명단입니다. 연동된 명단(공무원·공무직)은 인사정보가 <b>읽기 전용</b>이고 현업업무만 고릅니다.
            부서 계약직·일용 근로자는 <b>직접 등록</b>으로 관리합니다. 현업업무를 바꾸면 <b>작업내용 변경 이력</b>에 남습니다.
        </div>
        <div id="ew-root"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/law-map.js"></script>
    <script src="./js/help-center.js"></script><!-- DYHELP: 화면 도움말 -->
    <script src="./js/policy-open.js"></script><!-- 외부 자료·연계 준비사항 (DYPOLICY) -->
    <script src="./js/common.js"></script>
    <script src="./js/org-pick.js"></script>
    <script src="./js/edu-data.js"></script>
    <script src="./js/doc-flow.js"></script><!-- 공문 공용 골격 (DYDOC) -->
    <script src="./js/edu-doc.js"></script><!-- 교육 공문 (EDUDOC) -->
    <script src="./js/edu-filter.js"></script>
    <script src="./js/edu-workers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.EDUW.init('ew-root');
            /* 안전보건교육 단계별 안내(EDUTOUR)는 싣지 않는다 — 이 화면은 «현업근로자 관리» 대메뉴다(2차 통화 검토 C-5) */
        });
    </script>
</body>
</html>
